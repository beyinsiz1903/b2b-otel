[tool.pytest.ini_options]
# Sadece backend/tests altındaki gerçek pytest dosyalarını topla.
# Root'taki eski script'ler (backend_test.py, *_websocket_test.py, vb.)
# canlı sunucuya istek atan manuel araçlardır, pytest fixture değildir.
testpaths = ["backend/tests"]
addopts = "-q"

[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "bcrypt==4.1.3",
    "boto3>=1.43.2",
    "cryptography>=47.0.0",
    "email-validator>=2.3.0",
    "fastapi==0.110.1",
    "google-api-python-client>=2.195.0",
    "google-auth>=2.50.0",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "motor==3.3.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "passlib>=1.7.4",
    "pydantic>=2.13.3",
    "pymongo==4.5.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.27",
    "requests>=2.33.1",
    "slowapi>=0.1.9",
    "uvicorn==0.25.0",
    "websockets>=16.0",
]
