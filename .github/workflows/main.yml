name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Python dosyalarını kontrol et
        run: |
          python -m compileall backend tests *.py

      - name: Python testlerini çalıştır
        run: |
          pytest -q

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend paketlerini kur
        run: |
          if [ -f frontend/package-lock.json ]; then
            cd frontend && npm ci
          elif [ -f frontend/package.json ]; then
            cd frontend && npm install
          else
            echo "frontend/package.json bulunamadı, frontend kurulumu atlandı."
          fi

      - name: Frontend build al
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm run build --if-present
          else
            echo "frontend/package.json bulunamadı, frontend build atlandı."
          fi
